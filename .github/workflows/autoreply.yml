name: Comment-to-DM auto-reply
on:
  schedule:
    - cron: "17 * * * *"   # hourly (GitHub may delay runs by up to 1-2 h; Sujith is fine with that)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: autoreply
jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reply to comments (keyword DMs + friendly replies)
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python autoreply/ig_autoreply.py --kits autoreply/kits.json --state autoreply/state.json
      - name: Save handled comment IDs
        run: |
          git config user.name "autoreply-bot"
          git config user.email "autoreply-bot@users.noreply.github.com"
          git add autoreply/state.json
          git diff --cached --quiet || git commit -m "Update handled comments" && git push
